<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>        
        <link rel="preload" href="{{ "css/tailwind.css" | absURL }}" as="style">
        <link rel="preload" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" as="style">            
        <style>
            .carousel-item {
                display: inline-block;
                margin: 0 1rem;
            }            
            .tech-carousel {
                overflow: hidden;
                width: 100%;
                padding: 1rem 0;
            }
            .carousel-track {
                white-space: nowrap;
            }
        </style>
        
        <link rel="stylesheet" href="{{ "css/tailwind.css" | absURL }}">
        <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
        <script>
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
        <style>
            :root {
                color-scheme: light dark;
            }
            
            .tech-icon {
                filter: grayscale(100%) brightness(200%);
                transition: all 0.3s ease;
            }
            .tech-icon:hover {
                filter: none;
            }
            
            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-100%);
                }
            }
            
            .tech-carousel {
                width: 100%;
                padding: 1rem 0;
            }
            
            .tech-track {
                width: fit-content;
                animation: scroll 20s linear infinite;
            }
            
            .tech-track:hover {
                animation-play-state: paused;
            }
            
            .tech-slide {
                float: left;
            }
        </style>
        <style>
            /* 글 안의 코드 표시에 백틱(`) 기호가 그대로 보이지 않게 */
            .prose code::before, .prose code::after { content: none !important; }
            /* 테마에 미리 빌드된 tailwind.css에 없는 클래스를 직접 정의 (반응형 수정용) */
            .whitespace-nowrap { white-space: nowrap; }
            @media (max-width: 767px) { .p-5 { padding: 1.25rem; } }
            @media (min-width: 640px) { .sm\:px-8 { padding-left: 2rem; padding-right: 2rem; } }
            @media (min-width: 768px) { .md\:px-14 { padding-left: 3.5rem; padding-right: 3.5rem; } }
            @media (min-width: 1024px) { .lg\:flex { display: flex; } }
        </style>
    </head>
    <body class="min-h-screen bg-bg-primary-light dark:bg-bg-primary-dark text-text-primary-light dark:text-text-primary-dark">
        {{ partial "header" . }}
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer" . }}
    </body>
</html>
